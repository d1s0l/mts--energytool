name: mts-energytool
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: energytool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energytool}
      POSTGRES_DB: energytool
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energytool -d energytool"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KNOWLEDGE_BASE_PATH: /data/knowledge-base.zip
      RAG_MODE: ${RAG_MODE:-local}
      MAX_WORKERS: ${MAX_WORKERS:-3}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TEMPERATURE: ${TEMPERATURE:-0}
      MAX_TOKENS: ${MAX_TOKENS:-1600}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      EMB_MODEL: ${EMB_MODEL:-BAAI/bge-m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      DATABASE_URL: postgresql://energytool:${POSTGRES_PASSWORD:-energytool}@postgres:5432/energytool
    volumes:
      - type: bind
        source: ${KNOWLEDGE_BASE_PATH:?Set KNOWLEDGE_BASE_PATH in .env to the knowledge-base.zip path}
        target: /data/knowledge-base.zip
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
