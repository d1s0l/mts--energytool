name: mts-energytool
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: energytool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energytool}
      POSTGRES_DB: energytool
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energytool -d energytool"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://energytool:${POSTGRES_PASSWORD:-energytool}@postgres:5432/energytool
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
